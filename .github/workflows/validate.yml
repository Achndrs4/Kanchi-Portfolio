name: validate

# Validation runs on every push and pull request. The corpus is the deliverable,
# so an encoding error reaching the main branch is a data-integrity incident, not
# a style issue. Everything here is also runnable locally via scripts/validate.sh,
# because CI that cannot be reproduced on a laptop just relocates the debugging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  corpus:
    name: TEI corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install XML tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils unzip
          mkdir -p .lib
          # -f/--fail turns a transient HTTP error into a real curl exit code
          # instead of a 0-exit-status HTML error page silently written to
          # the output file; --retry covers transient network/CDN blips
          # without masking a genuinely broken URL.
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/saxon.jar \
            https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/xmlresolver.jar \
            https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2.jar
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/xmlresolver-data.jar \
            https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2-data.jar
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/jing.zip \
            https://github.com/relaxng/jing-trang/releases/download/V20241231/jing-20241231.zip
          unzip -q /tmp/jing.zip -d /tmp/jing
          cp /tmp/jing/jing-20241231/bin/jing.jar .lib/
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/tei-xsl.zip \
            https://github.com/TEIC/Stylesheets/releases/download/v7.61.0/tei-xsl-7.61.0.zip
          unzip -q /tmp/tei-xsl.zip -d .lib/teixsl

      - name: Regenerate schema from ODD
        run: bash scripts/build-schema.sh

      - name: Fail if the committed schema is stale
        # The generated schema is committed for contributors without Saxon. If
        # regenerating it produces a diff, the ODD and the schema disagree and
        # the committed artefact is misleading.
        run: |
          if ! git diff --quiet -- schema/madurai-tei.rng schema/madurai-tei.sch; then
            echo "::error::schema/ is out of date; run scripts/build-schema.sh and commit"
            git --no-pager diff --stat -- schema/
            exit 1
          fi

      - name: Compile Schematron
        run: |
          # Downloaded under their real basenames, not shortened, because the
          # ISO skeleton files xsl:include each other by those exact names --
          # renaming them here breaks the includes even though each file is
          # individually fetched fine.
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/iso_svrl_for_xslt2.xsl \
            https://raw.githubusercontent.com/Schematron/schematron/master/trunk/schematron/code/iso_svrl_for_xslt2.xsl
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/iso_schematron_skeleton_for_saxon.xsl \
            https://raw.githubusercontent.com/Schematron/schematron/master/trunk/schematron/code/iso_schematron_skeleton_for_saxon.xsl
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/iso_dsdl_include.xsl \
            https://raw.githubusercontent.com/Schematron/schematron/master/trunk/schematron/code/iso_dsdl_include.xsl
          curl -sL -f --retry 3 --retry-delay 2 -o /tmp/iso_abstract_expand.xsl \
            https://raw.githubusercontent.com/Schematron/schematron/master/trunk/schematron/code/iso_abstract_expand.xsl
          cp /tmp/iso_*.xsl .lib/
          java -cp ".lib/saxon.jar:.lib/xmlresolver.jar:.lib/xmlresolver-data.jar" \
            net.sf.saxon.Transform -s:schema/madurai-tei.sch \
            -xsl:.lib/iso_svrl_for_xslt2.xsl -o:.lib/madurai-tei-sch.xsl

      - name: Validate corpus
        run: bash scripts/validate.sh

      - name: Negative tests
        # A validator that never rejects anything is indistinguishable from one
        # that does nothing. These fixtures must fail.
        run: |
          for fixture in test/invalid-*.xml; do
            cp "$fixture" data/texts/_ci-negative.xml
            if bash scripts/validate.sh > /dev/null 2>&1; then
              echo "::error::$fixture was accepted but should have been rejected"
              rm -f data/texts/_ci-negative.xml
              exit 1
            fi
            rm -f data/texts/_ci-negative.xml
            echo "correctly rejected: $fixture"
          done

  transforms:
    name: XSLT and RDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          mkdir -p .lib
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/saxon.jar \
            https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/xmlresolver.jar \
            https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2.jar
          curl -sL -f --retry 3 --retry-delay 2 -o .lib/xmlresolver-data.jar \
            https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2-data.jar
          pip install --quiet rdflib

      - name: TEI to HTML
        run: |
          CP=".lib/saxon.jar:.lib/xmlresolver.jar:.lib/xmlresolver-data.jar"
          for f in data/texts/*.xml; do
            java -cp "$CP" net.sf.saxon.Transform -s:"$f" \
              -xsl:xslt/tei-to-html.xsl -o:"/tmp/$(basename "$f" .xml).html"
          done
          ls -la /tmp/*.html

      - name: TEI to RDF, then parse it
        # Generating Turtle that does not parse is a silent failure, so the
        # output is fed straight back into a parser.
        run: |
          CP=".lib/saxon.jar:.lib/xmlresolver.jar:.lib/xmlresolver-data.jar"
          java -cp "$CP" net.sf.saxon.Transform -s:data/texts/halasya-mahatmya.xml \
            -xsl:xslt/tei-to-rdf.xsl -o:/tmp/madurai-tei.ttl \
            authority-doc="$PWD/data/authority/authority.xml"
          python -c "
          from rdflib import Graph
          g = Graph(); g.parse('/tmp/madurai-tei.ttl', format='turtle')
          assert len(g) > 0, 'empty graph'
          print(f'{len(g)} triples parsed')
          "

  service:
    name: Flask service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          pip install --quiet -r services/flask/requirements.txt pytest
          python -m pytest test/test_translit.py -q

  integration:
    name: eXist integration
    # The README claims the application "was deployed to a live 6.4.1
    # instance and the endpoints exercised over HTTP." This job is what
    # makes that a checked claim instead of a historical one: it builds the
    # real .xar, autodeploys it into a real eXist-db, and hits real RESTXQ
    # endpoints over HTTP, including the negative case for the docs
    # endpoint's path-traversal guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build the .xar
        run: bash scripts/build-xar.sh

      - name: Start eXist-db (autodeploys build/*.xar)
        run: docker compose up -d exist

      - name: Wait for the application to come up
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null "http://localhost:8080/exist/restxq/madurai-tei/api"; then
              echo "up after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::eXist never answered /exist/restxq/madurai-tei/api within 200s"
          # Distinguish a slow/failed container start from a container that
          # started fine but where the madurai-tei package never autodeployed.
          if curl -sf -o /dev/null "http://localhost:8080/exist/"; then
            echo "::error::eXist itself is up, so the madurai-tei package failed to autodeploy or its RESTXQ module failed to register"
          else
            echo "::error::eXist's own REST endpoint never came up either -- this is a container start problem, not an autodeploy problem"
          fi
          docker compose logs exist
          exit 1

      - name: Exercise the documented endpoints
        run: |
          base="http://localhost:8080/exist/restxq/madurai-tei/api"

          check() {
            # $2 is a space-separated list of acceptable status codes, since
            # the deep-traversal case below is rejected by two different
            # layers depending on how far it reaches into the app.
            local desc="$1" expected="$2"; shift 2
            local code
            code="$(curl -s -o /tmp/resp -w '%{http_code}' "$@")"
            for ok in $expected; do
              if [ "$code" = "$ok" ]; then
                echo "ok: $desc ($code)"
                return 0
              fi
            done
            echo "::error::$desc: expected HTTP [$expected], got $code"
            cat /tmp/resp
            exit 1
          }

          check "service description" 200 "$base"
          check "text list" 200 "$base/texts"
          check "one text as TEI" 200 "$base/texts/TVP" -H "Accept: application/tei+xml"
          check "one text as JSON" 200 "$base/texts/TVP" -H "Accept: application/json"
          check "reading view as HTML" 200 "$base/texts/TVP" -H "Accept: text/html"
          check "apparatus criticus" 200 "$base/texts/TVP/apparatus"
          check "one verse" 200 "$base/verses/TVP-1"
          check "verse alignment" 200 "$base/verses/TVP-1/aligned"
          check "entities" 200 "$base/entities"
          check "full-text search" 200 -G "$base/search" --data-urlencode "q=மதுரை" --data-urlencode "lang=tam"

          # Project docs served through the app, so <ref> links in sourceDesc
          # resolve to something live.
          check "docs: top-level file" 200 "$base/docs/architecture.md"
          check "docs: ADR subdirectory" 200 "$base/docs/adr/0005-lod-alignment.md"

          # Negative cases for the path-traversal guard added in api.xqm:
          # a real ".." segment (curl normally collapses "..", so
          # --path-as-is is required to actually send one) and a path that
          # doesn't end in .md must both be rejected, never served.
          #
          # The traversal case is deep enough (4 levels) to eat past
          # "/exist/restxq/" itself once Jetty normalizes the dot-segments
          # during its own URI parsing -- that normalization happens before
          # RESTXQ routing sees the request at all, so it never reaches
          # api:serve-doc's explicit ".." check and instead falls through to
          # whatever else is mapped under "/exist/*", which answers 405
          # rather than 404. Either way nothing is served, so both codes
          # count as "rejected" here.
          check "docs: rejects .. traversal" "404 405" --path-as-is "$base/docs/../../../../etc/passwd"
          check "docs: rejects non-.md path" 404 "$base/docs/architecture"

          curl -s -G "$base/search" --data-urlencode "q=மதுரை" --data-urlencode "lang=tam" | grep -q "TVP-1" \
            || { echo "::error::search for மதுரை did not return TVP-1"; exit 1; }

      - name: Logs (always, for debugging)
        if: always()
        run: docker compose logs exist

      - name: Tear down
        if: always()
        run: docker compose down -v
